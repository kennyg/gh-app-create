version: 2
project_name: gh-app-create

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/gh-app-create/
    binary: gh-app-create-{{ .Os }}-{{ .Arch }}
    no_unique_dist_dir: true
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - formats:
      - binary
    name_template: "{{ .Binary }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
